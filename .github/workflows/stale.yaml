---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stale

on:
  schedule:
    - cron: 30 1 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          permission-issues: write
          permission-pull-requests: write

      - name: Stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          stale-issue-message: |
            This issue has been marked as stale due to 180 days of inactivity. Please remove the stale label or leave a comment to keep it open.
            If no action is taken, it will be automatically closed in 14 days.
          stale-pr-message: |
            This pull request has been marked as stale due to 180 days of inactivity. Please remove the stale label or leave a comment to keep it open.
            If no action is taken, it will be automatically closed in 14 days.
          close-issue-message: |
            This issue has been automatically closed after 14 days of inactivity following the stale status.
          close-pr-message: |
            This pull request has been automatically closed after 14 days of inactivity following the stale status.
          days-before-stale: 180
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          delete-branch: true
